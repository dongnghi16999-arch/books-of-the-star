<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books Of The Star</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    font-family: Arial, sans-serif;
    background-color: #041423;
}

.hero {
    min-height: 100vh;
    width: 100%;
    background:
        linear-gradient(
            rgba(4, 20, 35, 0.55),
            rgba(4, 20, 35, 0.55)
        ),
        url("images/banner.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 5%;
}

.hero-content {
    color: white;
    text-align: center;
    max-width: 850px;
    width: 100%;
}

.subtitle {
    color: #D5B77A;
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: clamp(2px, 0.5vw, 5px);
    margin-bottom: 20px;
    line-height: 1.4;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(26px, 4.5vw, 44px);
    font-weight: normal;
    line-height: 1.2;
}

.description {
    margin-top: 20px;
    font-size: clamp(13px, 1.8vw, 15px);
    letter-spacing: 1px;
    line-height: 1.5;
    color: #f5f5f5;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 28px;
    border: 1px solid #D5B77A;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    font-size: clamp(12px, 1.5vw, 14px);
    transition: all 0.3s ease;
}

.button:hover {
    background: #D5B77A;
    color: #102637;
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">
        <div class="subtitle">
            KHÁM PHÁ THẾ GIỚI CỦA NHỮNG CON CHỮ THÔNG OUA VÌ SAO ★
        </div>

        <h1>Books Of The Star</h1>

        <p class="description">
            Nơi giới thiệu đến bạn đọc những tựa sách hay và ý nghĩa.<br>⡞⠳⣄⣀⣠⠞⢷ ֹ۪
        </p>

        <a href="https://sites.google.com/view/booksofthestar/trang-ch%E1%BB%A7/tu-sach-anh-sao"
           class="button"
           target="_blank"
           rel="noopener noreferrer">
            Tìm Sách Ngay →
        </a>
    </div>
</section>

</body>
</html>
