<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden; /* Khóa chặt không cho cuộn dọc và ngang */
    font-family: Arial, sans-serif;
}

.hero {
    height: 100vh; /* Dùng height tuyệt đối thay vì min-height */
    width: 100%;
    background:
        linear-gradient(
            rgba(4, 20, 35, 0.55),
            rgba(4, 20, 35, 0.55)
        ),
        url("images/banner.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 5%;
}

.hero-content {
    color: white;
    text-align: center;
    max-width: 850px;
    width: 100%;
}

.subtitle {
    color: #D5B77A;
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: clamp(2px, 0.5vw, 5px);
    margin-bottom: 15px;
    line-height: 1.4;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(26px, 4.5vw, 44px);
    font-weight: normal;
    line-height: 1.2;
}

.description {
    margin-top: 15px;
    font-size: clamp(13px, 1.8vw, 15px);
    letter-spacing: 1px;
    line-height: 1.5;
    color: #f5f5f5;
}

.button {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 28px;
    border: 1px solid #D5B77A;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    font-size: clamp(12px, 1.5vw, 14px);
    transition: all 0.3s ease;
}

.button:hover {
    background: #D5B77A;
    color: #102637;
}
</style>
