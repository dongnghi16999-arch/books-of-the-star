<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Books Of The Star</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
}

.hero {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;

    background:
    linear-gradient(
        rgba(4, 20, 35, 0.55),
        rgba(4, 20, 35, 0.55)
    ),
    url("images/banner.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 10%;
    overflow: hidden;
}

.hero-content {
    width: 100%;
    max-width: 100%;
    color: white;
    text-align: center;
}

.subtitle {
    color: #D5B77A;
    font-family: Arial, sans-serif;
    letter-spacing: 5px;
    margin-bottom: 25px;
    font-size: 16px;
    line-height: 1.6;
}

h1 {
    font-family: Georgia, serif;
    font-size: 52px;
    font-weight: normal;
    line-height: 1.2;
}

.description {
    margin-top: 25px;
    font-size: 18px;
    letter-spacing: 1px;
    line-height: 1.7;
}

.button {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 35px;
    border: 1px solid #D5B77A;
    color: white;
    text-decoration: none;
    letter-spacing: 3px;
    transition: 0.3s;
}

.button:hover {
    background: #D5B77A;
    color: #102637;
}

/* GIAO DIỆN ĐIỆN THOẠI */
@media screen and (max-width: 600px) {

    .hero {
        padding: 25px 6%;
        background-position: center center;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: clamp(30px, 9vw, 40px);
    }

    .description {
        font-size: 13px;
        letter-spacing: 0.3px;
        margin-top: 20px;
    }

    .button {
        margin-top: 25px;
        padding: 13px 22px;
        font-size: 12px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div class="hero-content">

        <div class="subtitle">
            KHÁM PHÁ THẾ GIỚI CỦA NHỮNG CON CHỮ THÔNG QUA VÌ SAO ★
        </div>

        <h1>Books Of The Star</h1>

        <p class="description">
            Nơi giới thiệu đến bạn đọc những tựa sách hay và ý nghĩa.
            <br>⡞⠳⣄⣀⣠⠞⢷ ֹ۪
        </p>

        <a href="https://sites.google.com/view/booksofthestar/trang-ch%E1%BB%A7/tu-sach-anh-sao"
           class="button"
           target="_blank"
           rel="noopener noreferrer">
            Tìm Sách Ngay →
        </a>

    </div>
</section>
<!-- BOOKS OF THE STAR - BACKGROUND MUSIC -->
<div id="star-music-player">
  <audio id="starMusic" loop preload="auto">
    <source src="https://dongnghi16999-arch.github.io/books-of-the-star/background.mp3" type="audio/mpeg">
  </audio>

  <button id="musicToggle" type="button">♫ Bật nhạc</button>

  <div class="music-volume">
    <span>♪</span>
    <input
      id="musicVolume"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="0.25"
      aria-label="Điều chỉnh âm lượng"
    >
  </div>
</div>

<style>
  #star-music-player {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid #C9A85C;
    border-radius: 30px;
    background: rgba(4, 18, 43, 0.94);
    color: #F5D98B;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
    font-family: Arial, sans-serif;
  }

  #musicToggle {
    border: none;
    background: transparent;
    color: #F5D98B;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .music-volume {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
  }

  #musicVolume {
    width: 65px;
    accent-color: #C9A85C;
    cursor: pointer;
  }

  @media (max-width: 480px) {
    #star-music-player {
      right: 10px;
      bottom: 10px;
      padding: 9px 12px;
    }
  }
</style>

<script>
  const music = document.getElementById("starMusic");
  const toggle = document.getElementById("musicToggle");
  const volume = document.getElementById("musicVolume");

  music.volume = 0.25;

  toggle.addEventListener("click", async () => {
    if (music.paused) {
      try {
        await music.play();
        toggle.textContent = "♫ Tắt nhạc";
      } catch (error) {
        toggle.textContent = "Không phát được nhạc";
      }
    } else {
      music.pause();
      toggle.textContent = "♫ Bật nhạc";
    }
  });

  volume.addEventListener("input", () => {
    music.volume = Number(volume.value);
  });
</script>
</body>
</html>
